# Publishes this static site to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
#
# A push runs only the quick checks (the unit tests, a few seconds, with
# nothing to install) and then publishes. The browser tests are run on your
# own machine before pushing: `npm run check`, or let the pre-push hook do it
# (see README, "Checks").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deployment in progress finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A pull request is only checked.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  # A push to main is checked and published in one go.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The unit tests import only the site's own files, so nothing is installed.
      - run: npm test
      - run: npm run prepare-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
